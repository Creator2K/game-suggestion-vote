<!doctype html>
<html lang="zh-CN">
<head>
{{> admin-head}}
<title>后台登录 · {{gameName}}</title>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <svg class="login-box__mark" viewBox="0 0 12 9" xmlns="http://www.w3.org/2000/svg"
         shape-rendering="crispEdges" aria-hidden="true">
      <g fill="#e9bd6d">
        <rect x="5" y="0" width="2" height="1"/><rect x="4" y="1" width="4" height="1"/>
        <rect x="2" y="2" width="8" height="1"/><rect x="1" y="3" width="10" height="1"/>
        <rect x="0" y="4" width="12" height="1"/><rect x="1" y="5" width="10" height="1"/>
        <rect x="2" y="6" width="8" height="1"/><rect x="4" y="7" width="4" height="1"/>
        <rect x="5" y="8" width="2" height="1"/>
      </g>
      <g fill="#f7e3b4">
        <rect x="3" y="2" width="3" height="1"/><rect x="2" y="3" width="2" height="1"/>
      </g>
      <g fill="#b0873a">
        <rect x="8" y="3" width="3" height="1"/><rect x="7" y="4" width="5" height="1"/>
        <rect x="6" y="5" width="5" height="1"/><rect x="5" y="6" width="5" height="1"/>
      </g>
    </svg>

    <h1 class="login-box__title" id="box-title">后台登录</h1>
    <p class="login-box__sub" id="box-sub">请输入管理员密码</p>

    <form id="login-form" novalidate>
      <label class="px-label" id="pw-wrap">
        <span>管理员密码</span>
        <input class="px-input" type="password" id="pw" autocomplete="current-password"
               maxlength="200" placeholder="请输入密码">
      </label>

      <label class="px-label" id="pw2-wrap" hidden>
        <span>再输一次确认</span>
        <input class="px-input" type="password" id="pw2" autocomplete="new-password"
               maxlength="200" placeholder="重复输入">
      </label>

      <div class="fs1 mt2" id="pw-hint" hidden>
        至少 8 位，建议混合字母数字。忘记密码可以在服务器上运行
        <code>node scripts/reset-password.js</code> 重置。
      </div>

      <button class="px-btn px-btn--primary px-btn--block mt4" type="submit" id="go">登录</button>
    </form>

    <p class="center fs1 muted mt4">
      <a href="/">← 回玩家端</a>
    </p>
  </div>
</div>

{{> toasts}}

<script src="/js/common.js"></script>
<script src="/admin/js/admin.js"></script>
<script src="/admin/js/login.js"></script>
</body>
</html>
