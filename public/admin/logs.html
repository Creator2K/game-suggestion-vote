<!doctype html>
<html lang="zh-CN">
<head>
{{> admin-head}}
<title>操作日志 · 后台</title>
</head>
<body class="admin">
{{> admin-nav}}

<main class="admin__main">
  <header class="admin__bar">
    <h1 class="admin__title">操作日志</h1>
    <div class="spacer"></div>
    <span class="fs1 muted">保留 180 天</span>
    <span class="fs1 muted" id="whoami"></span>
  </header>

  <div class="admin__body">
    <div class="table-wrap">
      <table class="px-table admin-table">
        <thead>
          <tr>
            <th style="width:140px">时间</th>
            <th style="width:180px">动作</th>
            <th style="width:80px">对象</th>
            <th>详情</th>
            <th style="width:130px">来源 IP</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</main>

{{> toasts}}

<script src="/js/common.js"></script>
<script src="/admin/js/admin.js"></script>
<script src="/admin/js/logs.js"></script>
</body>
</html>
