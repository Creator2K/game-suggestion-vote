<!doctype html>
<html lang="zh-CN">
<head>
{{> head}}
<title>查我的建议 · {{gameName}}</title>
</head>
<body>
{{> topbar}}

<main class="wrap page">
  <h1 class="page__title">查我的建议</h1>
  <p class="page__lead">
    用提交时填的邮箱查询。能在这里看到每条建议的状态、票数，以及被拒绝时的理由。
  </p>

  <section class="px-panel px-panel--tight mb4">
    <div class="identity">
      <label class="px-label identity__field">
        <span>你的邮箱</span>
        <input class="px-input" type="email" id="m-email" maxlength="254"
               autocomplete="email" placeholder="提交建议时填的那个邮箱">
      </label>
      <button class="px-btn px-btn--primary" type="button" id="m-go">查询</button>
    </div>
  </section>

  <div id="result"></div>
</main>

{{> footer}}

<script src="/js/common.js"></script>
<script src="/js/mine.js"></script>
</body>
</html>
